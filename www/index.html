<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>CivilVerify</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; display: grid; place-items: center; height: 100vh; background: #faf7f2; color: #3a3a3a; text-align: center; }
